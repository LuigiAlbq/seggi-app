# Application Information
spring.application.name=seggi-app

# PostgreSQL DataSource Configuration
# Dev local fallback; in other environments configure SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:seggidb}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration (Flyway handles schema migrations; Hibernate validates)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Spring Boot Actuator Configuration (Exposes /actuator/health with database connectivity validation)
# Em produção, 'when-authorized' evita exposição sensível de detalhes internos do banco
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Swagger / OpenAPI Paths
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Spring Core Configuration
spring.main.allow-circular-references=true