      summary: Delete payment by ID
      operationId: deletePaymentById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Payment deleted successfully
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Payment not found

components:
  schemas:
    CardStatus:
      type: string
      enum:
        - ACTIVE
        - DISABLED

    PaymentType:
      type: string
      enum:
        - BOLETO
        - CREDITO
        - DEBITO
        - PIX

    UserRequest:
      type: object
      required:
        - userName
        - email
        - password
      properties:
        userName:
          type: string
          example: "john.doe"
        email:
          type: string
          format: email
          example: "john@example.com"
        password:
          type: string
          format: password
          example: "Secret123"
        cardStatus:
          $ref: '#/components/schemas/CardStatus'
        groupIds:
          type: array
          items:
            type: integer
            format: int64

    UserResponse:
      type: object
      properties:
        idUser:
          type: integer
          format: int64
          example: 1
        userName:
          type: string
          example: "john.doe"
        email:
          type: string
          example: "john@example.com"
        cardStatus:
          $ref: '#/components/schemas/CardStatus'

    RoleRequest:
      type: object
      required:
        - roleName
      properties:
        roleName:
          type: string
          example: "ADMIN"

    RoleResponse:
      type: object
      properties:
        idRole:
          type: integer
          format: int64
          example: 1
        roleName:
          type: string
          example: "ADMIN"

    GroupRequest:
      type: object
      required:
        - groupName
      properties:
        groupName:
          type: string
          example: "Logistics Team"
        userIds:
          type: array
          items:
            type: integer
            format: int64
        roleIds:
          type: array
          items:
            type: integer
            format: int64

    ProductRequest:
      type: object
      required:
        - name
        - price
      properties:
        name:
          type: string
          example: "Item A"
        price:
          type: number
          format: double
          example: 49.90
        weight:
          type: number
          format: double
          example: 1.5
        warehouseId:
          type: integer
          format: int64
        orderId:
          type: integer
          format: int64

    WarehouseRequest:
      type: object
      required:
        - name
        - capacity
      properties:
        name:
          type: string
          example: "Central Warehouse"
        address:
          type: string
          example: "Av. Paulista, 1000"
        capacity:
          type: integer
          example: 5000

    PaymentRequest:
      type: object
      required:
        - paymentConstant
        - paymentValue
      properties:
        paymentConstant:
          $ref: '#/components/schemas/PaymentType'
        numCard:
          type: string
          example: "1234567812345678"
        cvv:
          type: string
          example: "123"
        expirationDate:
          type: string
          example: "12/28"
        paymentValue:
          type: number
          format: double
          example: 199.90
        orderId:
          type: integer
          format: int64

    ProductResponse:
      type: object
      properties:
        idProduct:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "Item A"
        price:
          type: number
          format: double
          example: 49.90
        weight:
          type: number
          format: double
          example: 1.5
        warehouseId:
          type: integer
          format: int64
        orderId:
          type: integer
          format: int64

    WarehouseResponse:
      type: object
      properties:
        idWarehouse:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "Central Warehouse"
        address:
          type: string
          example: "Av. Paulista, 1000"
        capacity:
          type: integer
          example: 5000

    PaymentResponse:
      type: object
      properties:
        idPayment:
          type: integer
          format: int64
          example: 1
        paymentConstant:
          $ref: '#/components/schemas/PaymentType'
        numCard:
          type: string
          example: "1234567812345678"
        cvv:
          type: string
          example: "123"
        expirationDate:
          type: string
          example: "12/28"
        paymentValue:
          type: number
          format: double
          example: 199.90
        orderId:
          type: integer
          format: int64

